<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incognito Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121212; color: #e0e0e0;
    height: 100vh; display: flex; flex-direction: column;
  }
  .topbar {
    background: #1e1e1e; padding: 12px; display: flex; gap: 8px;
    align-items: center; border-bottom: 1px solid #333;
  }
  .logo {
    font-weight: bold; color: #a78bfa; font-size: 16px; margin-right: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .input-group {
    flex: 1; display: flex; background: #2a2a2a; border-radius: 20px;
    padding: 4px 12px; border: 1px solid #444;
  }
  .input-group:focus-within { border-color: #a78bfa; }
  input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-size: 15px; padding: 8px 0;
  }
  input::placeholder { color: #888; }
  button {
    background: #a78bfa; color: #000; border: none; border-radius: 16px;
    padding: 0 16px; font-weight: bold; cursor: pointer; font-size: 14px;
  }
  button:active { opacity: 0.8; }
  .banner {
    background: #2a2a2a; color: #a78bfa; font-size: 12px; padding: 8px 12px;
    text-align: center; border-bottom: 1px solid #333;
  }
  .content {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 20px; text-align: center;
  }
  .eye {
    width: 80px; height: 80px; background: linear-gradient(135deg, #a78bfa, #6d28d9);
    border-radius: 50%; margin-bottom: 20px; position: relative;
    box-shadow: 0 0 40px rgba(167, 139, 250, 0.3);
  }
  .eye::after {
    content: ''; position: absolute; width: 30px; height: 30px;
    background: #121212; border-radius: 50%; top: 25px; left: 25px;
  }
  .eye::before {
    content: ''; position: absolute; width: 10px; height: 10px;
    background: #fff; border-radius: 50%; top: 32px; left: 32px; z-index: 2;
  }
  h1 { font-size: 24px; margin-bottom: 10px; color: #fff; }
  p { font-size: 14px; color: #888; max-width: 400px; line-height: 1.5; margin-bottom: 20px; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .link-btn {
    background: #2a2a2a; color: #ccc; padding: 10px 16px; border-radius: 12px;
    text-decoration: none; font-size: 14px; border: 1px solid #444;
    transition: 0.2s; display: inline-block;
  }
  .link-btn:hover { background: #3a3a3a; border-color: #a78bfa; color: #fff; }
  .clear-btn {
    background: #ef4444; color: #fff; padding: 12px 24px; border-radius: 20px;
    font-size: 15px; margin-top: 30px; cursor: pointer; border: none;
    font-weight: bold; transition: 0.2s;
  }
  .clear-btn:hover { background: #dc2626; }
  .status {
    margin-top: 15px; color: #22c55e; font-size: 13px; height: 20px;
    opacity: 0; transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="logo">👁 Incognito</div>
    <div class="input-group">
      <input type="text" id="url" placeholder="Введите адрес или поисковый запрос..." autocomplete="off">
    </div>
    <button onclick="go()">➜</button>
  </div>

  <div class="banner">
    🛡️ Режим инкогнито: история, куки и кэш не сохраняются
  </div>

  <div class="content">
    <div class="eye"></div>
    <h1>Безопасный просмотр</h1>
    <p>Всё, что вы вводите здесь, исчезает при закрытии вкладки. Мы не используем базы данных и не сохраняем логи.</p>
    
    <div class="links">
      <a href="https://duckduckgo.com" target="_blank" rel="noopener noreferrer" class="link-btn">🦆 DuckDuckGo</a>
      <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="link-btn">🌐 Example</a>
      <a href="https://ru.wikipedia.org" target="_blank" rel="noopener noreferrer" class="link-btn">📖 Wikipedia</a>
    </div>

    <button class="clear-btn" onclick="wipeData()">Очистить всё сейчас</button>
    <div class="status" id="status">✅ Данные успешно очищены!</div>
  </div>

<script>
  // 1. Функция перехода (поиск или прямой URL)
  function go() {
    let input = document.getElementById('url').value.trim();
    if (!input) return;

    // Если это не похоже на URL, ищем в DuckDuckGo (он не сохраняет историю)
    if (!input.includes('.') || input.includes(' ')) {
      input = 'https://duckduckgo.com/?q=' + encodeURIComponent(input);
    } else if (!input.startsWith('http')) {
      input = 'https://' + input;
    }

    // Открываем в новой вкладке
    window.open(input, '_blank', 'noopener,noreferrer');
    
    // Очищаем строку после перехода (чтобы не осталось в памяти)
    document.getElementById('url').value = '';
  }

  // 2. Обработка нажатия Enter
  document.getElementById('url').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') go();
  });

  // 3. Полная очистка данных (LocalStorage, SessionStorage, Cookies)
  function wipeData() {
    // Очистка хранилищ
    localStorage.clear();
    sessionStorage.clear();

    // Очистка куки (удаляем всё, что принадлежит текущему домену)
    document.cookie.split(";").forEach(function(c) { 
      document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
    });

    // Очистка поля ввода
    document.getElementById('url').value = '';

    // Показать сообщение об успехе
    const status = document.getElementById('status');
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 3000);
  }

  // 4. Автоматическая очистка при уходе со страницы/закрытии
  window.addEventListener('beforeunload', function() {
    localStorage.clear();
    sessionStorage.clear();
  });

  // Дополнительная страховка
  window.addEventListener('pagehide', function() {
    localStorage.clear();
    sessionStorage.clear();
  });
</script>

</body>
</html>
